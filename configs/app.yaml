# =============================================================================
#  Configuración de ejecución - Sistema de prevención de caídas en escaleras
# =============================================================================
# Todo lo que se puede ajustar sin tocar el código (RQNF21, RQNF24).
# Las rutas relativas se resuelven desde la raíz del repositorio.
# Cualquier valor se puede sobrescribir por línea de comandos:
#     python -m backend --set engine.pose_every=4 --set server.port=8000

server:
  host: 127.0.0.1
  port: 5000
  debug: false
  # Tamaño máximo de una petición. Solo lo usan los módulos aparte (fotografía
  # de Imagen y archivo de Audio): el vídeo es SOLO en vivo, no se suben vídeos.
  max_upload_mb: 64

# 'auto' usa la GPU si existe; también 'cpu', 'cuda' o un índice (0, 1...).
device: auto

models:
  # Modelo definitivo "Modelo S7 v4" (release v1.2.0-escaleras-v4).
  # No se reentrena: es el entregable final.
  detector: models/detector/escaleras_s7_v4.pt
  # YOLOv8s COCO: localiza personas y objetos sobre la escalera.
  coco: models/coco/yolov8s.pt
  # Pesos de superresolución (Real-ESRGAN), descargados por tools/download_models.py
  sr_dir: models/sr

inference:
  conf: 0.25          # umbral por defecto del detector (la interfaz lo ajusta)
  imgsz: 640

# Cadencias del motor: cada cuántos fotogramas se ejecuta cada etapa en vídeo
# y cámara. Son números coprimos para que las etapas no coincidan en el mismo
# fotograma y el coste por frame se mantenga estable (~30 fps en vivo).
engine:
  pose_every: 8
  people_every: 6
  stairs_every: 13
  obstacle_every: 11
  classify_every: 6
  person_conf: 0.20
  person_imgsz: 512
  max_stairs_boxes: 2

# Umbrales (RQF04). Ver README, sección "Desviaciones conscientes".
thresholds:
  prefilter: 0.75       # RQF04 pre-filtrado
  confirm: 0.85         # RQF04 confirmación
  obstacle: 0.25        # objetos pequeños sobre el escalón
  alert: 0.35           # puerta de disparo de alerta
  fall_crop_conf: 0.50  # caída vía recorte (sin pose) necesita al menos esto
  fall_confirm_frames: 3

# Persistencia y seguimiento (RQF05, RQF06)
persistence:
  alto_seconds: 1.2
  medio_seconds: 0.6
  default_seconds: 1.0
  grace_seconds: 1.0       # histéresis: un parpadeo no reinicia la cuenta
  occlusion_seconds: 1.0   # oclusión tolerada por el tracker IoU
  cooldown_seconds: 15.0   # una alerta por persona y tipo cada 15 s como máximo
  iou_match: 0.25

# Alertas y evidencia (RQF07, RQNF16)
alerts:
  dir: outputs/alerts
  keep_days: 7
  max_images: 200

# Privacidad (RQNF14, Ley N.º 29733)
privacy:
  anonymize_faces: true

# Mejora de calidad de vídeo con Real-ESRGAN (x4)
enhancement:
  # auto = activa con GPU, desactivada en CPU (en CPU no llega a tiempo real)
  enabled: auto
  half: true                 # FP16 en GPU
  live:
    # Modelo ligero de la familia Real-ESRGAN pensado para vídeo:
    # realesr-general-x4v3 (SRVGGNetCompact, ~1.2 M parámetros).
    model: general_x4v3
    input_max: 480           # lado mayor que entra a la red (~22 ms en RTX 5070)
    output_width: 960        # ancho que se envía al navegador (lienzo del panel)
    jpeg_quality: 80

# Fuente de la cámara del SERVIDOR para /api/stream (índice o URL RTSP/HTTP).
# El modo "Cámara en vivo" del panel usa la webcam del navegador.
camera:
  source: 0
  reconnect_attempts: 5

# Perfil de hardware. Debe funcionar en una GTX 1650 (4 GB, Turing sm_75):
# la build cu128 de PyTorch ya soporta sm_75; el perfil "baja_vram" solo
# ajusta lo que en esa tarjeta cuesta demasiado. Ver backend/hardware.py.
hardware:
  profile: auto          # auto | normal | baja_vram
  low_vram_gb: 4.5       # en auto, una GPU con <= 4.5 GB (o GTX 16xx) usa baja_vram
  baja_vram:
    enhancement.half: false            # GTX 16xx: FP16 da NaN/negro en varias redes
    enhancement.live.input_max: 320    # ~2.2x menos trabajo para Real-ESRGAN en vivo

# Módulos aparte. Viven en modulos/ y NO modifican el vídeo en vivo: si uno
# falla al cargar, el panel de vídeo sigue funcionando igual.
modules:
  audio:
    # Percepción acústica (repo brigitteve/percepcion): pisadas, carrera,
    # impacto de caída, gritos/auxilio y clasificador ML de caídas.
    enabled: true
    options:
      alerts_file: outputs/audio_alerts/alertas.jsonl
      sensitivity: media     # alta | media | baja
      ml_detector: true      # clasificador MLP del grupo (audio_fall_detector)
      max_sessions: 4
  imagen:
    # Análisis de fotografía y fotogramas (repo AndreCastAst, rama s7-imagen):
    # YOLO11 + YOLO11-Pose, calidad óptica y preprocesamiento adaptativo.
    enabled: true
    options:
      detector: models/imagen/yolo11n.pt
      pose: models/imagen/yolo11n-pose.pt
      device: auto           # auto | cpu | cuda
