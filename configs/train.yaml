# Configuracion de entrenamiento - Prevencion de Caidas y Riesgos en Escaleras
# Consumida por scripts/train.py. Todo es sobreescribible por CLI.

# --- Modelo ---------------------------------------------------------------
# yolov8s como modelo final. Con el dataset ampliado a 6 clases y 2505
# imagenes de entrenamiento ya hay volumen suficiente para que un modelo
# mayor rinda, y Caso.md exige >=30 FPS (RQNF01) con >=6 GB de VRAM
# (RQNF03): yolov8s a 640 ronda los 100 FPS de inferencia, muy por encima.
# El baseline yolov8n de 5 clases quedo en runs/yolov8n_balanced.
model: yolov8s

# --- Datos ----------------------------------------------------------------
data: datasets/combined/data.yaml
# Nombre del yaml alternativo con la clase mas frecuente submuestreada.
# `persona` concentra ~4.5k cajas frente a ~95 de `persona_sentado` y ~357
# de `persona_desequilibrio`. Submuestrear la clase dominante sube el peso
# efectivo de las clases de postura, que son las que el sistema necesita
# para detectar riesgo.
balanced_data: datasets/combined/data_balanced.yaml
use_balanced: true
# Fraccion de la clase mayoritaria que se conserva al balancear.
keep_majority_fraction: 0.45

# --- Entrenamiento --------------------------------------------------------
epochs: 50
imgsz: 640
batch: 12
seed: 42
device: 0
workers: 2
patience: 15          # early stopping
project: runs
name: yolov8s_6clases

# --- Augmentaciones -------------------------------------------------------
# RQNF12 pide resiliencia ante variaciones de iluminacion, asi que se refuerza
# HSV. `degrees` da tolerancia a la inclinacion de la camara sobre la escalera.
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 10.0
translate: 0.1
scale: 0.5
shear: 2.0
flipud: 0.0           # las escaleras son direccionales: no invertir vertical
fliplr: 0.5
mosaic: 1.0
close_mosaic: 10      # desactiva mosaic en las ultimas 10 epocas
mixup: 0.0

# --- Entrenamiento / validacion final --------------------------------------
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
optimizer: auto
cos_lr: false
val: true
plots: true
save_period: -1