# Configuración de entrenamiento - Escaleras dataset v4 (fine-tuning)
# Consumida por scripts/train_escaleras.py.
#
# Cambios vs v3: dropout 0.1→0.2 (volver a v2), cutmix 0.0→0.1 (volver a v2),
# auto_augment=None (eliminado: posible fuente de inestabilidad en clases pequeñas)
# Split val cambiado: 01.mp4→val (tiene todas las clases)
#

# --- Modelo ---
model: runs/yolov8s_zoom/weights/best.pt
pretrained_weights: true

# --- Datos ---
data: datasets/escaleras_dataset/data.yaml
balanced_data: datasets/escaleras_dataset/data.yaml
use_balanced: false
max_boxes_per_class: 2000

# --- Entrenamiento ---
epochs: 100
imgsz: 640
batch: 8
seed: 42
device: 0
workers: 2
patience: 25
project: runs
name: yolov8s_escaleras_v4
resume:

# --- Augmentaciones ---
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 10.0
translate: 0.1
scale: 0.5
shear: 2.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
close_mosaic: 10
mixup: 0.15

# --- Optimización / Regularización ---
lr0: 0.0003
lrf: 0.01
momentum: 0.937
weight_decay: 0.001
warmup_epochs: 5.0
optimizer: auto
cos_lr: true

# --- Técnicas anti-sobreajuste (YOLOv8 8.4.170) ---
dropout: 0.2          # v2: mejor test mAP50 (0.7214)
cls_pw: 0.25
cls: 0.3
cutmix: 0.1          # v2: ayudó persona_sentada (test AP 0.995)
auto_augment: null    # eliminado: inestabiliza clases pequeñas

val: true
plots: true
save_period: -1
