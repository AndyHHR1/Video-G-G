# ByteTrack para los esqueletos de YOLOv8-Pose (skeleton.tracker en app.yaml).
# Se llama una vez por cada fotograma analizado (skeleton.every), así que
# track_buffer cuenta llamadas: 45 llamadas a 15 por segundo ≈ 3 s de oclusión
# tolerada (pasamanos, personas que se cruzan) antes de perder la identidad.
tracker_type: bytetrack
track_high_thresh: 0.40    # detecciones fiables: primera asociación
track_low_thresh: 0.10     # detecciones débiles (persona tapada): segunda asociación
new_track_thresh: 0.50     # confianza para abrir una identidad nueva
track_buffer: 45
match_thresh: 0.80
fuse_score: true
